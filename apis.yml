aid: orchid-labs
name: Orchid Labs
description: >-
  Orchid Labs is the company behind Orchid, an open-source, decentralized
  marketplace for bandwidth and a privacy-focused VPN. Orchid lets users pay for
  VPN service through nanopayments settled on a probabilistic payment layer built
  on Ethereum, using the OXT utility token and Orchid Accounts rather than
  traditional subscriptions. The stack includes an open-source multi-hop VPN
  client (Dart), the Orchid DApp for account creation and management, a
  decentralized directory of bandwidth providers running as smart contracts, and
  an L2/L3 nanopayment protocol. Backed by a16z, Sequoia Capital, DFJ, and
  Polychain, Orchid Labs focuses on decentralized privacy infrastructure rather
  than a conventional developer REST API.
